name: Build Fateh Messenger APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p source
          if [ -f "FatehMessenger-GitHub-Starter.zip" ]; then
            unzip -o FatehMessenger-GitHub-Starter.zip -d source
          else
            cp -r . source/project
          fi

          echo "Project files:"
          find source -maxdepth 4 -type f | head -200

      - name: Find Gradle wrapper
        run: |
          WRAPPER=$(find source -type f -name gradlew | head -1)

          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew found. The Android project needs its Gradle build files."
            exit 1
          fi

          echo "GRADLEW_PATH=$WRAPPER" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$WRAPPER")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          "$GITHUB_WORKSPACE/$GRADLEW_PATH" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path
