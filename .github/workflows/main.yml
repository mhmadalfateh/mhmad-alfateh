name: Build Fateh Messenger APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la

      - name: Build APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "FatehMessenger-GitHub-Starter.zip" ]; then
            unzip -q FatehMessenger-GitHub-Starter.zip -d project
            cd project
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "No Gradle wrapper found in ZIP"
              exit 1
            fi
          else
            echo "No Android Gradle project found"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FatehMessenger-APK
          path: |
            **/build/outputs/apk/debug/*.apk
